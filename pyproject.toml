[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dev-logs-mcp"
version = "0.1.0"
description = "Bounded read-only local development log tools with redacted MCP stdio responses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "mcp==2.3.0",
  "pydantic>=2.12,<3",
  "google-re2==1.1.20251105",
]

[project.scripts]
dev-logs-mcp = "dev_logs_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_logs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
